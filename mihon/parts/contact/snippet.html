<!--
  部品: 予約・問い合わせ（AIホームページ製作所 freehp.jp の見本用）
  動いている見本と使い方: https://freehp.jp/mihon/parts/#contact
  このファイルはカタログから自動で書き出したもの。直すときはカタログ（mihon/parts/index.html）を直して
  tools/mihon_parts_snippets.py を流し直す。
  見本（mihon/<slug>/index.html）に差し込むとき:
    <head> に  <link rel="stylesheet" href="../parts/tokens.css">
               <link rel="stylesheet" href="../parts/contact/contact.css">
    </body> の前に <script src="../parts/contact/contact.js"></script>
    <body> に data-fhp-tone="aoba" などトーンを付ける（または tokens.css の変数を見本の :root に書く）
-->
<!-- 営業時間は data-hours に曜日ごと。昼休みは "11:00-14:00,17:00-22:00"、定休日は ""。
     使わない連絡手段は href を空にするか、その <a> を消す。 -->
<div class="fhp fhp-contact" data-fhp-contact data-last-call="30"
     data-hours='{"月":"9:00-19:00","火":"9:00-19:00","水":"","木":"9:00-19:00","金":"9:00-19:00","土":"9:00-19:00","日":"10:00-17:00"}'>
  <p class="fhp-contact-status" aria-live="polite">
    <span class="fhp-contact-dot" aria-hidden="true"></span>
    <span class="fhp-contact-title">営業時間を確かめています</span>
    <span class="fhp-contact-detail"></span>
  </p>
  <div class="fhp-contact-actions">
    <a class="fhp-btn" data-channel="tel" href="tel:000-0000-0000">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5l2.6 3.7-1.7 2.1a12.4 12.4 0 0 0 7.2 7.2l2.1-1.7 3.7 2.6-1.3 3.1c-.4.9-1.3 1.4-2.3 1.2C9.6 20.5 3.5 14.4 2.3 7.1c-.2-1 .3-1.9 1.2-2.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span class="fhp-btn-label">電話する</span><small>000-0000-0000</small></a>
    <a class="fhp-btn fhp-btn--sub" data-channel="reserve" href="https://example.com/reserve">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8"/></svg>
      <span class="fhp-btn-label">ネットで予約する</span><small>24時間</small></a>
    <a class="fhp-btn fhp-btn--sub" data-channel="line" href="https://line.me/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4C7 4 3 7.2 3 11.2c0 3.5 3.1 6.5 7.3 7.1l-.6 2.7 3.6-2.6c4.6-.3 7.7-3.4 7.7-7.2C21 7.2 17 4 12 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span class="fhp-btn-label">LINEで問い合わせる</span><small>返信は営業時間内</small></a>
  </div>
  <p class="fhp-contact-note" hidden><span></span></p>
  <table class="fhp-contact-week">
    <caption>営業時間</caption>
    <tbody></tbody>
  </table>
</div>
