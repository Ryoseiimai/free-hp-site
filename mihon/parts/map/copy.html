<!--
  地図（AIホームページ製作所がつくった、無料で使える部品）
  動いている見本: https://freehp.jp/mihon/parts/#map
  使い方
    1. このコードをまるごと、自分のページの置きたい場所に貼る
    2. すぐ下の :root { ... } にある色（--fhp- で始まる行）を、お店の色に書き換える
    3. 文字・写真・リンク先を、自分のお店のものに書き換える
  写真と音声は見本用の仮のものです（実在するお店の商品として使わないでください）。
  Copyright (c) 2026 RYOSEIWORKS (Ryosei Imai). MIT No Attribution（MIT-0）。商用・改変・再配布も自由で、表記は要りません。
-->
<style>
/*
  部品の色・角丸・書体の差し込み口（トークン）
  ------------------------------------------------------------
  部品のCSSはすべてこの変数だけを見る。色を変えたいときは、下の :root の値を書き換えるだけでよい。
  用意したトーン（あおば・元気堂・そらまめ）を使うときは、部品の外側（body など）に data-fhp-tone="aoba" などを付ける。
    --fhp-bg        地の色
    --fhp-fg        文字の色（地に対し 4.5:1 以上）
    --fhp-muted     補助の文字（地に対し 4.5:1 以上）
    --fhp-line      飾りの区切り線（弱くてよい）
    --fhp-edge      押せる物の枠線（地に対し 3:1 以上。WCAG 1.4.11）
    --fhp-accent    差し色。ボタンの塗り・印・選んだ状態だけに使う（地に対し 4.5:1 以上）
    --fhp-on-accent 差し色の上の文字（4.5:1 以上）
    --fhp-shade     写真を拡大したときの暗い地（白い文字が乗る）
    --fhp-radius    大きい枠の角丸   --fhp-radius-s  ボタンなど小さい物の角丸
    --fhp-display   見出しの書体     --fhp-body      本文の書体
*/
:root {
  --fhp-bg: #FFFFFF;
  --fhp-fg: #1D1D1F;
  --fhp-muted: #6E6E73;
  --fhp-line: #D2D2D7;
  --fhp-edge: #86868B;
  --fhp-accent: #1B6B44;
  --fhp-on-accent: #FFFFFF;
  --fhp-shade: #1D1D1F;
  --fhp-radius: 14px;
  --fhp-radius-s: 10px;
  --fhp-display: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --fhp-body: var(--fhp-display);
}

/* 純喫茶 あおば: 暗い木の地・象牙色の文字・ランプの琥珀。角は立てる */
[data-fhp-tone="aoba"] {
  --fhp-bg: #221812;
  --fhp-fg: #EFE3CB;
  --fhp-muted: #C9BBA2;
  --fhp-line: rgba(239, 227, 203, .24);
  --fhp-edge: #7D6E5A;
  --fhp-accent: #E4B96A;
  --fhp-on-accent: #221812;
  --fhp-shade: #140E0A;
  --fhp-radius: 0px;
  --fhp-radius-s: 0px;
  --fhp-display: "Kaisei Decol", "Hiragino Mincho ProN", serif;
  --fhp-body: "Zen Kaku Gothic Antique", "Hiragino Sans", sans-serif;
  color-scheme: dark;
}

/* からだ元気堂: 白地・システムフォント・観葉植物の緑。角は丸い（Apple HIG 寄り） */
[data-fhp-tone="genkido"] {
  color-scheme: light;
  --fhp-bg: #FFFFFF;
  --fhp-fg: #1D1D1F;
  --fhp-muted: #6E6E73;
  --fhp-line: #D2D2D7;
  --fhp-edge: #86868B;
  --fhp-accent: #1B6B44;
  --fhp-on-accent: #FFFFFF;
  --fhp-shade: #1D1D1F;
  --fhp-radius: 14px;
  --fhp-radius-s: 10px;
  --fhp-display: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --fhp-body: var(--fhp-display);
}

/* そらまめ焙煎所: 白地・深煎りの茶・クラフト紙。見出しは明朝、角はわずかに */
[data-fhp-tone="soramame"] {
  color-scheme: light;
  --fhp-bg: #FFFFFF;
  --fhp-fg: #3B2B20;
  --fhp-muted: #6F6053;
  --fhp-line: #E6DAC6;
  --fhp-edge: #9C8466;
  --fhp-accent: #7A5230;
  --fhp-on-accent: #FFFFFF;
  --fhp-shade: #2A1F17;
  --fhp-radius: 4px;
  --fhp-radius-s: 3px;
  --fhp-display: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
  --fhp-body: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
}

/* 部品の共通の土台。部品の一番外側に .fhp を付ける */
.fhp {
  color: var(--fhp-fg);
  font-family: var(--fhp-body);
  font-feature-settings: "palt" 1;
}
.fhp *, .fhp *::before, .fhp *::after { box-sizing: border-box; }
.fhp :focus-visible { outline: 2px solid var(--fhp-accent); outline-offset: 3px; }
.fhp .fhp-nw { white-space: nowrap; }
/* 部品の中で display を指定していても、hidden を付けた物は必ず隠す */
.fhp [hidden] { display: none !important; }
/* 見本の BudouX（文節の途中で改行しない）に合わせ、フォームやボタンの文字も同じ折り返し方にする。
   文は <span> に入れておくと、BudouX が文節の区切りを入れる */
.fhp legend, .fhp label, .fhp summary, .fhp button, .fhp .fhp-btn {
  word-break: keep-all;
  overflow-wrap: anywhere;
  line-break: strict;
}
.fhp-vh {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* 部品で使うボタンの共通形。塗り（主）と枠（副）の2種類だけ */
.fhp-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5em;
  min-height: 48px;
  padding: .55em 1.3em;
  border: 1px solid var(--fhp-accent);
  border-radius: var(--fhp-radius-s);
  background: var(--fhp-accent);
  color: var(--fhp-on-accent);
  font: inherit;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.fhp-btn:hover { text-decoration: underline; text-underline-offset: .25em; }
.fhp-btn--sub {
  border-color: var(--fhp-edge);
  background: transparent;
  color: var(--fhp-fg);
}
.fhp-btn svg { flex: none; width: 1.15em; height: 1.15em; }
.fhp-btn[hidden] { display: none; }

/*
  地図
  読み込む前は、枠線と一言だけ（塗り箱にしない）。読み込んだら iframe が枠いっぱいに入る。
*/
.fhp-map { container-type: inline-size; }
.fhp-map-frame {
  position: relative;
  aspect-ratio: 4 / 3;
  max-height: 480px;
  border: 1px solid var(--fhp-line);
  border-radius: var(--fhp-radius);
  overflow: hidden;
}
.fhp-map-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.fhp-map-wait {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .9rem;
  margin: 0;
  padding: 1rem;
  color: var(--fhp-muted);
  text-align: center;
}
.fhp-map-wait[hidden] { display: none; }
.fhp-map-place { margin: 1rem 0 0; font-weight: 700; line-height: 1.6; }
.fhp-map-access { margin: .2rem 0 0; color: var(--fhp-muted); line-height: 1.7; }
.fhp-map-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 1.1rem; }

@container (min-width: 620px) {
  .fhp-map-frame { aspect-ratio: 16 / 9; }
  .fhp-map-actions { flex-direction: row; flex-wrap: wrap; }
}
</style>
<div class="fhp fhp-map" data-fhp-map data-query="東京駅" data-title="純喫茶 あおばの地図（見本のため東京駅を表示）">
  <div class="fhp-map-frame">
    <p class="fhp-map-wait">地図はこの場所まで来たら読み込みます。<button type="button" class="fhp-btn fhp-btn--sub fhp-map-now">今すぐ地図を表示</button></p>
  </div>
  <p class="fhp-map-place">純喫茶 あおば（架空のお店）</p>
  <p class="fhp-map-access">見本のため、地図は東京駅を指しています。</p>
  <div class="fhp-map-actions">
    <a class="fhp-btn" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%9D%B1%E4%BA%AC%E9%A7%85" target="_blank" rel="noopener">地図アプリで開く</a>
    <a class="fhp-btn fhp-btn--sub" href="https://www.google.com/maps/dir/?api=1&amp;destination=%E6%9D%B1%E4%BA%AC%E9%A7%85" target="_blank" rel="noopener">ここまでの道順を調べる</a>
  </div>
</div>
<script>
/*
  地図: Google マップの埋め込み（APIキー不要の output=embed 形式）を、画面に近づいてから読み込む。
  - data-query に住所か場所の名前。これだけで埋め込み地図を作る
  - 画面の手前 300px まで来たら iframe を入れる（ページの最初の表示を重くしない）
  - 「今すぐ表示」ボタンでも読み込める（キーボードで操作する人・印刷前に見たい人向け）
  - 「地図アプリで開く」「道順」のリンクは HTML に直接書く（JS が動かなくても使える）
*/
(function () {
  'use strict';

  var PRELOAD_MARGIN = '300px 0px';
  var ZOOM = 16;

  function embedUrl(query) {
    return 'https://www.google.com/maps?q=' + encodeURIComponent(query) + '&z=' + ZOOM + '&hl=ja&output=embed';
  }

  function load(root) {
    if (root.dataset.loaded) return;
    root.dataset.loaded = 'true';
    var frame = root.querySelector('.fhp-map-frame');
    var iframe = document.createElement('iframe');
    iframe.src = embedUrl(root.dataset.query);
    iframe.title = root.dataset.title || '地図';
    iframe.loading = 'lazy';
    iframe.referrerPolicy = 'no-referrer-when-downgrade';
    iframe.allowFullscreen = true;
    frame.appendChild(iframe);
    var wait = frame.querySelector('.fhp-map-wait');
    if (wait) wait.hidden = true;
  }

  function initMap(root) {
    var now = root.querySelector('.fhp-map-now');
    if (now) now.addEventListener('click', function () { load(root); });
    if (!('IntersectionObserver' in window)) {
      load(root);
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      if (!entries.some(function (e) { return e.isIntersecting; })) return;
      io.disconnect();
      load(root);
    }, { rootMargin: PRELOAD_MARGIN });
    io.observe(root);
  }

  function initAll() {
    // 同じ部品のコードを2回貼っても、1つの部品を二重に動かさない
    document.querySelectorAll('[data-fhp-map]').forEach(function (el) {
      if (el.dataset.fhpReady) return;
      el.dataset.fhpReady = 'true';
      initMap(el);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAll);
  else initAll();
})();
</script>
