<!--
  よくある質問（AIホームページ製作所がつくった、無料で使える部品）
  動いている見本: https://freehp.jp/mihon/parts/#faq
  使い方
    1. このコードをまるごと、自分のページの置きたい場所に貼る
    2. すぐ下の :root { ... } にある色（--fhp- で始まる行）を、お店の色に書き換える
    3. 文字・写真・リンク先を、自分のお店のものに書き換える
  写真と音声は見本用の仮のものです（実在するお店の商品として使わないでください）。
  Copyright (c) 2026 RYOSEIWORKS (Ryosei Imai). MIT No Attribution（MIT-0）。商用・改変・再配布も自由で、表記は要りません。
-->
<style>
/*
  部品の色・角丸・書体の差し込み口（トークン）
  ------------------------------------------------------------
  部品のCSSはすべてこの変数だけを見る。色を変えたいときは、下の :root の値を書き換えるだけでよい。
  用意したトーン（あおば・元気堂・そらまめ）を使うときは、部品の外側（body など）に data-fhp-tone="aoba" などを付ける。
    --fhp-bg        地の色
    --fhp-fg        文字の色（地に対し 4.5:1 以上）
    --fhp-muted     補助の文字（地に対し 4.5:1 以上）
    --fhp-line      飾りの区切り線（弱くてよい）
    --fhp-edge      押せる物の枠線（地に対し 3:1 以上。WCAG 1.4.11）
    --fhp-accent    差し色。ボタンの塗り・印・選んだ状態だけに使う（地に対し 4.5:1 以上）
    --fhp-on-accent 差し色の上の文字（4.5:1 以上）
    --fhp-shade     写真を拡大したときの暗い地（白い文字が乗る）
    --fhp-radius    大きい枠の角丸   --fhp-radius-s  ボタンなど小さい物の角丸
    --fhp-display   見出しの書体     --fhp-body      本文の書体
*/
:root {
  --fhp-bg: #FFFFFF;
  --fhp-fg: #1D1D1F;
  --fhp-muted: #6E6E73;
  --fhp-line: #D2D2D7;
  --fhp-edge: #86868B;
  --fhp-accent: #1B6B44;
  --fhp-on-accent: #FFFFFF;
  --fhp-shade: #1D1D1F;
  --fhp-radius: 14px;
  --fhp-radius-s: 10px;
  --fhp-display: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --fhp-body: var(--fhp-display);
}

/* 純喫茶 あおば: 暗い木の地・象牙色の文字・ランプの琥珀。角は立てる */
[data-fhp-tone="aoba"] {
  --fhp-bg: #221812;
  --fhp-fg: #EFE3CB;
  --fhp-muted: #C9BBA2;
  --fhp-line: rgba(239, 227, 203, .24);
  --fhp-edge: #7D6E5A;
  --fhp-accent: #E4B96A;
  --fhp-on-accent: #221812;
  --fhp-shade: #140E0A;
  --fhp-radius: 0px;
  --fhp-radius-s: 0px;
  --fhp-display: "Kaisei Decol", "Hiragino Mincho ProN", serif;
  --fhp-body: "Zen Kaku Gothic Antique", "Hiragino Sans", sans-serif;
  color-scheme: dark;
}

/* からだ元気堂: 白地・システムフォント・観葉植物の緑。角は丸い（Apple HIG 寄り） */
[data-fhp-tone="genkido"] {
  color-scheme: light;
  --fhp-bg: #FFFFFF;
  --fhp-fg: #1D1D1F;
  --fhp-muted: #6E6E73;
  --fhp-line: #D2D2D7;
  --fhp-edge: #86868B;
  --fhp-accent: #1B6B44;
  --fhp-on-accent: #FFFFFF;
  --fhp-shade: #1D1D1F;
  --fhp-radius: 14px;
  --fhp-radius-s: 10px;
  --fhp-display: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --fhp-body: var(--fhp-display);
}

/* そらまめ焙煎所: 白地・深煎りの茶・クラフト紙。見出しは明朝、角はわずかに */
[data-fhp-tone="soramame"] {
  color-scheme: light;
  --fhp-bg: #FFFFFF;
  --fhp-fg: #3B2B20;
  --fhp-muted: #6F6053;
  --fhp-line: #E6DAC6;
  --fhp-edge: #9C8466;
  --fhp-accent: #7A5230;
  --fhp-on-accent: #FFFFFF;
  --fhp-shade: #2A1F17;
  --fhp-radius: 4px;
  --fhp-radius-s: 3px;
  --fhp-display: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
  --fhp-body: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
}

/* 部品の共通の土台。部品の一番外側に .fhp を付ける */
.fhp {
  color: var(--fhp-fg);
  font-family: var(--fhp-body);
  font-feature-settings: "palt" 1;
}
.fhp *, .fhp *::before, .fhp *::after { box-sizing: border-box; }
.fhp :focus-visible { outline: 2px solid var(--fhp-accent); outline-offset: 3px; }
.fhp .fhp-nw { white-space: nowrap; }
/* 部品の中で display を指定していても、hidden を付けた物は必ず隠す */
.fhp [hidden] { display: none !important; }
/* 見本の BudouX（文節の途中で改行しない）に合わせ、フォームやボタンの文字も同じ折り返し方にする。
   文は <span> に入れておくと、BudouX が文節の区切りを入れる */
.fhp legend, .fhp label, .fhp summary, .fhp button, .fhp .fhp-btn {
  word-break: keep-all;
  overflow-wrap: anywhere;
  line-break: strict;
}
.fhp-vh {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* 部品で使うボタンの共通形。塗り（主）と枠（副）の2種類だけ */
.fhp-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5em;
  min-height: 48px;
  padding: .55em 1.3em;
  border: 1px solid var(--fhp-accent);
  border-radius: var(--fhp-radius-s);
  background: var(--fhp-accent);
  color: var(--fhp-on-accent);
  font: inherit;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.fhp-btn:hover { text-decoration: underline; text-underline-offset: .25em; }
.fhp-btn--sub {
  border-color: var(--fhp-edge);
  background: transparent;
  color: var(--fhp-fg);
}
.fhp-btn svg { flex: none; width: 1.15em; height: 1.15em; }
.fhp-btn[hidden] { display: none; }

/*
  よくある質問
  <details>/<summary> をそのまま使う（JS なし。キーボード・読み上げ・ページ内検索がはじめから効く）。
  一度に1つだけ開かせたいときは、同じ組の <details> に同じ name="…" を付ける（対応ブラウザのみ。未対応でも普通に開閉できる）。
  開閉のアニメーションは ::details-content に対応したブラウザだけ。動きを減らす設定の人には付けない。
*/
.fhp-faq { border-top: 1px solid var(--fhp-line); }
.fhp-faq-item { border-bottom: 1px solid var(--fhp-line); }
.fhp-faq-item > summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 20px;
  align-items: center;
  gap: 16px;
  min-height: 56px;
  padding: .85rem 0;
  font-weight: 700;
  line-height: 1.6;
  list-style: none;
  cursor: pointer;
}
.fhp-faq-item > summary::-webkit-details-marker { display: none; }
.fhp-faq-item > summary:hover .fhp-faq-q { text-decoration: underline; text-underline-offset: .25em; }
.fhp-faq-item > summary:focus-visible { outline-offset: 2px; }
/* 開閉の印: 閉じているとき「＋」、開いているとき「－」 */
.fhp-faq-mark { position: relative; width: 20px; height: 20px; }
.fhp-faq-mark::before, .fhp-faq-mark::after {
  content: "";
  position: absolute;
  top: 9px;
  left: 2px;
  width: 16px;
  height: 2px;
  background: var(--fhp-accent);
}
.fhp-faq-mark::after { transform: rotate(90deg); }
.fhp-faq-item[open] .fhp-faq-mark::after { transform: rotate(0deg); }
.fhp-faq-a { padding: 0 36px 1.1rem 0; color: var(--fhp-fg); line-height: 1.85; }
.fhp-faq-a p { margin: 0; }
.fhp-faq-a p + p { margin-top: .6em; }
.fhp-faq-a .fhp-faq-note { color: var(--fhp-muted); font-size: .92rem; }

@supports selector(::details-content) {
  .fhp-faq { interpolate-size: allow-keywords; }
  .fhp-faq-item::details-content {
    block-size: 0;
    overflow: clip;
    transition: block-size .22s ease, content-visibility .22s allow-discrete;
  }
  .fhp-faq-item[open]::details-content { block-size: auto; }
  .fhp-faq-mark::after { transition: transform .22s ease; }
}
@media (prefers-reduced-motion: reduce) {
  .fhp-faq-item::details-content, .fhp-faq-mark::after { transition: none !important; }
}
</style>
<div class="fhp fhp-faq">
  <details class="fhp-faq-item">
    <summary><span class="fhp-faq-q">席の予約はできますか？</span><span class="fhp-faq-mark" aria-hidden="true"></span></summary>
    <div class="fhp-faq-a"><p>ふだんは予約を受けていません。6名以上でお越しのときは、前日までにお電話ください。</p></div>
  </details>
  <details class="fhp-faq-item">
    <summary><span class="fhp-faq-q">カードや電子マネーは使えますか？</span><span class="fhp-faq-mark" aria-hidden="true"></span></summary>
    <div class="fhp-faq-a"><p>現金のほか、交通系ICカードとQRコード決済が使えます。</p><p class="fhp-faq-note">クレジットカードは使えません。</p></div>
  </details>
  <details class="fhp-faq-item">
    <summary><span class="fhp-faq-q">子ども連れでも入れますか？</span><span class="fhp-faq-mark" aria-hidden="true"></span></summary>
    <div class="fhp-faq-a"><p>はい。子ども用の椅子が2脚あります。ベビーカーは入口の横に置けます。</p></div>
  </details>
  <details class="fhp-faq-item">
    <summary><span class="fhp-faq-q">駐車場はありますか？</span><span class="fhp-faq-mark" aria-hidden="true"></span></summary>
    <div class="fhp-faq-a"><p>店の駐車場はありません。近くのコインパーキングをご利用ください。</p></div>
  </details>
</div>
